<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Comparação — continuidade Sobre e FAQ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      color: #2d333b;
      background: #d9e1ea;
      font: 700 12px/1.4 system-ui, sans-serif;
    }
    main {
      display: grid;
      grid-template-columns: repeat(2, 740px);
      gap: 24px;
      justify-content: center;
    }
    figure { margin: 0; }
    figcaption {
      margin-bottom: 8px;
      color: #57606a;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .frame {
      width: 740px;
      height: 553px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 10px 30px rgba(31, 36, 43, 0.14);
    }
    img {
      display: block;
      width: 740px;
      height: auto;
    }
  </style>
</head>
<body>
  <main>
    <figure>
      <figcaption>Referência</figcaption>
      <div class="frame">
        <img src="reference.png" alt="Referência para a continuidade entre Sobre mim e FAQ">
      </div>
    </figure>
    <figure>
      <figcaption>Implementação</figcaption>
      <div class="frame">
        <img src="implementation-closed.png" alt="Implementação final da continuidade entre Sobre mim e FAQ">
      </div>
    </figure>
  </main>
</body>
</html>
